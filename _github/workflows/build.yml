name: Build XuanShu Application

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Allows manual triggering

jobs:
  build:
    runs-on: windows-latest  # Using Windows runner since we're creating a Windows executable with .ico
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'  # Specify your Python version
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt --force-reinstall
        pip install pyinstaller
    
    - name: Build with PyInstaller
      run: |
        python -m PyInstaller --clean --noconfirm XuanShu.spec
    
    - name: Upload executable artifact
      uses: actions/upload-artifact@v4
      with:
        name: XuanShu
        path: dist/XuanShu.exe
        retention-days: 7  # Keep the artifact for 7 days